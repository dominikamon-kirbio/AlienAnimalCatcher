plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'io.github.dominikamon_kirbio.alienanimalcatcher'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.dominikamon_kirbio.alienanimalcatcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/gameAssets'))
    }
}

def copyGameAssets = tasks.register('copyGameAssets', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'style.css', 'game.js'
    }
    into(layout.buildDirectory.dir('generated/gameAssets'))
}

tasks.named('preBuild') {
    dependsOn(copyGameAssets)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
