name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK vorbereiten
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: APK bauen und Android-Lint ausführen
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: APK-Signatur prüfen und Datei bereitstellen
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk AlienAnimalCatcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlienAnimalCatcher-Android
          path: AlienAnimalCatcher.apk
          if-no-files-found: error
